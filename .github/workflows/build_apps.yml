name: Build Android & iOS Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 1. የ iPhone (.ipa) አፕ መገንቢያ (በነጻ የ macOS ሰርቨር)
  build_ios:
    name: Build iPhone IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Dependencies
        run: flutter pub get
      - name: Build Unsigned iOS App
        run: flutter build ios --release --no-codesign
      - name: Package into IPA file
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Mezgebe_Mihret_iOS.ipa Payload
      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-App-IPA
          path: Mezgebe_Mihret_iOS.ipa

  # 2. የ Android (.apk) አፕ መገንቢያ
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk